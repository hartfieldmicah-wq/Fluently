<style>
:root{
  --blue:#2563eb; --blue-2:#3b82f6; --blue-3:#60a5fa; --blue-deep:#1e40af;
  --blue-soft:rgba(37,99,235,.10);
  --glow:0 0 0 1px rgba(59,130,246,.35),0 8px 28px -6px rgba(37,99,235,.55);
  --glow-strong:0 0 0 1px rgba(96,165,250,.5),0 12px 40px -8px rgba(37,99,235,.8);
  --r:18px; --nav-h:68px;
  --bg:#f7f8fb; --card:#ffffff; --card-2:#f1f3f8; --line:#e3e7ef;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --mark-bg:rgba(37,99,235,.12); --mark:#1d4ed8;
  --star:#f59e0b; --heart:#ef4444;
}
:root[data-theme="dark"]{
  --bg:#1c1d21; --card:#26282e; --card-2:#2f3239; --line:#363942;
  --text:#f1f3f7; --muted:#9ba3b4; --faint:#6b7280;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --blue-soft:rgba(59,130,246,.16);
  --mark-bg:rgba(96,165,250,.18); --mark:#93c5fd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;transition:background .2s,color .2s}
body.noscroll{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[data-act]{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
svg{display:block;flex-shrink:0}
.muted{color:var(--muted)} .small{font-size:13px}
mark{background:var(--mark-bg);color:var(--mark);border-radius:5px;padding:0 3px;font-weight:700}

#app{max-width:640px;margin:0 auto}
.screen{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 36px);animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack > * + *{margin-top:10px}
.label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
.label a,.label button{letter-spacing:0;text-transform:none;font-size:14px;color:var(--blue-2);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;white-space:nowrap;transition:transform .12s,box-shadow .2s;flex:1}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;box-shadow:var(--glow)}
.btn.soft{background:var(--blue-soft);color:var(--blue-2)}
:root[data-theme="light"] .btn.soft{color:var(--blue)}
.btn.plain{background:var(--card-2);border:1px solid var(--line)}
.btn.white{background:#fff;color:var(--blue-deep)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.danger{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;flex:none;padding:0 14px}
.row-btns{display:flex;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex-shrink:0;transition:transform .12s}
.iconbtn:active{transform:scale(.93)}

/* progress */
.bar{height:6px;background:var(--card-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-3));transition:width .4s}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello h1{font-size:28px}
.hello p{color:var(--muted);font-size:14px;margin-top:2px}
.langchip{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.flag{display:inline-block;border-radius:5px;overflow:hidden;line-height:0;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.top-actions{display:flex;gap:8px;align-items:center}

/* hero session card */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#60a5fa 0%,#2563eb 38%,#1e3a8a 100%);box-shadow:var(--glow-strong)}
.hero::before{content:"";position:absolute;inset:auto -30% -60% auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero-top{display:flex;align-items:center;gap:16px;position:relative}
.hero-top .t{flex:1;min-width:0}
.hero small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.hero h2{font-size:22px;margin-top:4px}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .row-btns{margin-top:18px;position:relative}
.ring{position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px}
.pills{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700}

/* list rows */
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .12s}
.lrow:active{transform:scale(.985)}
.lrow + .lrow{margin-top:10px}
.lrow .b{flex:1;min-width:0}
.lrow .b b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .b span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lrow .b .bar{margin-top:8px}
.lrow > .chev{color:var(--faint)}
.sq{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--c,var(--blue));box-shadow:0 6px 16px -8px var(--c,var(--blue))}
.sq.lv{font-weight:900;font-size:16px;letter-spacing:-.02em}
.sq.lg{width:56px;height:56px;border-radius:16px}
.playdot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2);flex-shrink:0}

/* explore */
.explore{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:transform .12s;min-height:132px}
.ex:active{transform:scale(.97)}
.ex b{font-size:16px}
.ex span{font-size:13px;color:var(--muted)}
.ex.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
.ex.wide > div{flex:1}

/* segmented */
.seg{display:flex;padding:4px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);margin:14px 0 16px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .18s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:#3a3e47}
.seg button.on svg{color:var(--blue-2)}

.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.pagehead{margin-bottom:6px}
.pagehead h1{font-size:30px}
.pagehead p{color:var(--muted);margin-top:4px}

/* level cards with parts */
.lvcard{padding:16px}
.lvcard + .lvcard{margin-top:12px}
.lvhead{display:flex;align-items:center;gap:14px}
.lvhead .t{flex:1;min-width:0}
.lvhead b{font-size:17px}
.lvhead p{font-size:13px;color:var(--muted);margin-top:2px}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.parts.one{grid-template-columns:1fr}
.part{padding:10px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);text-align:left;transition:transform .12s,border-color .2s}
.part:active{transform:scale(.96)}
.part b{display:block;font-size:14px}
.part span{display:block;font-size:11px;color:var(--muted);margin:2px 0 6px}
.part .bar{height:4px}
.part.done{border-color:rgba(59,130,246,.55)}

/* set view */
.subhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.subhead .t{flex:1;min-width:0}
.subhead h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subhead p{font-size:13px;color:var(--muted);margin-top:1px}
.summary{display:flex;align-items:center;gap:14px}
.summary .t{flex:1;min-width:0}
.summary .t p{font-size:14px;color:var(--muted)}
.summary .meta{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 8px}
.filterbar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.filterbar .lbl{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.select{position:relative;flex:1}
.select select{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;padding:0 38px 0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px;outline:0}
.select select:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px var(--blue-soft)}
.select svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}

/* chunk card */
.chunk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px 12px;box-shadow:var(--shadow)}
.chunk + .chunk{margin-top:10px}
.chunk .main{display:flex;gap:12px;align-items:flex-start}
.chunk .txt{flex:1;min-width:0;padding-top:2px}
.de{font-size:17px;font-weight:600;line-height:1.35}
.en{font-size:14px;color:var(--muted);margin-top:3px}
.chunk .foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-left:50px}
.tagl{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;color:#fff;background:var(--c)}
.stars{display:flex;align-items:center}
.stars button{width:34px;height:34px;display:grid;place-items:center;color:var(--faint);border-radius:10px}
.stars button.on{color:var(--star)}
.stars button.on svg{fill:var(--star)}
.heart{width:40px;height:36px;display:grid;place-items:center;color:var(--faint);border-radius:10px;margin-left:auto}
.heart.on{color:var(--heart)}
.heart.on svg{fill:var(--heart)}
.heart.pop svg,.stars button.pop svg{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.play{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;flex-shrink:0;box-shadow:0 4px 12px -3px rgba(37,99,235,.7);transition:transform .12s}
.play:active{transform:scale(.9)}
.play.playing{animation:ping 1s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}100%{box-shadow:0 0 0 14px rgba(59,130,246,0)}}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--blue-soft);color:var(--blue-2);display:grid;place-items:center;margin:0 auto 12px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.more{display:block;width:100%;margin-top:12px}

/* progress page */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px}
.tile .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2)}
.tile b{display:block;font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.week{display:flex;gap:8px;align-items:flex-end;height:140px;margin-top:14px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.wk .col{flex:1;width:100%;background:var(--card-2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wk .col i{display:block;width:100%;border-radius:8px;background:linear-gradient(180deg,var(--blue-3),var(--blue))}
.wk span{font-size:11px;color:var(--muted);font-weight:700}
.wk.today span{color:var(--blue-2)}
.lp{display:flex;align-items:center;gap:12px;margin-top:14px}
.lp .sq{width:36px;height:36px;border-radius:11px;font-size:13px}
.lp > div{flex:1}
.lp .tp{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}

/* settings */
.sgroup{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 4px 10px}
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:first-child{padding-top:0}
.field:last-child{border-bottom:0;padding-bottom:0}
.field .fl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.field .desc{font-size:13px;color:var(--muted);margin-top:6px}
.inp{width:100%;min-height:46px;margin-top:10px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);font-size:16px;outline:0}
.inp:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px var(--blue-soft)}
.field .select{margin-top:10px}
.field .select.inline{margin-top:0;flex:none;min-width:130px}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--blue)}
.switch{position:relative;width:52px;height:32px;flex-shrink:0;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--card-2);border:1px solid var(--line);transition:.2s}
.switch span::before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}
.switch input:checked + span{background:var(--blue);border-color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.55)}
.switch input:checked + span::before{transform:translateX(20px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themes button{padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.themes button.on{border-color:var(--blue-2);background:var(--blue-soft);color:var(--blue-2);box-shadow:var(--glow)}
.note{background:var(--blue-soft);border-radius:12px;padding:12px;font-size:13px;margin-top:12px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--blue-2)}
pre{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;margin-top:8px}

/* nav: floating dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
.dock-in{pointer-events:auto;max-width:520px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;justify-content:space-around;border-radius:22px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(15,23,42,.25);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
:root[data-theme="dark"] .dock-in{background:rgba(38,40,46,.92);box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.dock button{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:700}
.dock .di{width:40px;height:32px;border-radius:12px;display:grid;place-items:center;transition:all .2s}
.dock button.on{color:var(--blue-2)}
.dock button.on .di{background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 4px 16px -2px rgba(37,99,235,.7)}

/* player */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;overflow-y:auto;-webkit-overflow-scrolling:touch}
#player.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.pw{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 18px)}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ptop .t{flex:1;min-width:0}
.ptop .t b{display:block;font-size:14px;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .n{font-weight:700;color:var(--muted);font-size:14px}
.pcard{flex:1;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:52px 18px 18px;border-radius:26px;background:var(--card);border:1px solid var(--line);position:relative;box-shadow:var(--shadow);transition:box-shadow .25s,border-color .25s}
body.speaking .pcard{border-color:rgba(59,130,246,.6);box-shadow:var(--glow-strong)}
.ptags{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card-2);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pde{font-size:clamp(24px,6.5vw,34px);font-weight:700;line-height:1.3}
.pen{font-size:17px;color:var(--muted)}
.pen.big{font-size:23px;color:var(--text);font-weight:700}
.phide{font-size:17px;color:var(--muted);font-weight:600;padding:12px 20px;border:2px dashed var(--line);border-radius:14px}
.pstatus{min-height:20px;font-size:14px;font-weight:600;color:var(--blue-2)}
.link{color:var(--blue-2);font-weight:700;font-size:15px}
.prate{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.pctl{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 12px}
.ctl{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:transform .12s;font-weight:800;font-size:13px}
.ctl:active{transform:scale(.92)}
.ctl.big{width:80px;height:80px;border:0;background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;box-shadow:var(--glow-strong)}
body.speaking .ctl.big{animation:ping 1.1s infinite}
.pauto{display:flex;justify-content:center;margin-bottom:14px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.chipbtn.on{border-color:var(--blue-2);color:var(--blue-2);background:var(--blue-soft);box-shadow:var(--glow)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{min-height:52px;border-radius:14px;font-weight:700;font-size:15px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.grade small{font-size:11px;font-weight:600;opacity:.75;margin-top:3px}
.g1{color:#ef4444;border-color:rgba(239,68,68,.35)!important;background:rgba(239,68,68,.07)}
.g2{color:var(--blue-2);border-color:rgba(59,130,246,.45)!important;background:var(--blue-soft)}
.g3{color:#16a34a;border-color:rgba(34,197,94,.4)!important;background:rgba(34,197,94,.08)}
.pend{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.pend .ei{width:80px;height:80px;border-radius:24px;background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:var(--glow-strong);margin-bottom:6px}
.pend .row-btns{width:100%;margin-top:14px}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.open{pointer-events:auto}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .22s}
#sheet.open .sbg{opacity:1}
.spanel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow-y:auto}
#sheet.open .spanel{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.spanel h3{font-size:19px;margin:0 6px 10px}
.langrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:14px;text-align:left}
.langrow .b{flex:1}
.langrow .b b{display:block}
.langrow .b span{font-size:13px;color:var(--muted)}
.langrow.on{background:var(--blue-soft)}
.langrow.on > svg{color:var(--blue-2)}
.soon{font-size:11px;font-weight:800;color:var(--muted);background:var(--card-2);padding:4px 9px;border-radius:99px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);transform:translate(-50%,16px);max-width:calc(100% - 32px);background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .22s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.vbanner{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border-radius:16px;background:var(--blue-soft);border:1px solid rgba(59,130,246,.3);width:100%;text-align:left}
.vbanner > svg{color:var(--blue-2)}
.vbanner .b{flex:1;font-size:14px}
@media (min-width:700px){.screen{padding-left:24px;padding-right:24px}.explore{grid-template-columns:repeat(4,1fr)}.ex.wide{grid-column:span 2}}
@media (hover:hover){.lrow:hover,.ex:hover,.part:hover{border-color:rgba(59,130,246,.45)}}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl = t => esc(t).replace(/\[(.+?)\]/g, '<mark>$1</mark>');
const wait = ms => new Promise(r => setTimeout(r, ms));
function hash(s){let h=5381;for(const ch of s)h=((h<<5)+h+ch.codePointAt(0))|0;return (h>>>0).toString(36)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function parseChunks(raw, code){
  const out=[], seen=new Set(); let cat='';
  raw.split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line[0]==='@'){ cat=line.slice(1); return }
    const [level,t,en] = line.split('|');
    const plain = t.replace(/[\[\]]/g,'');
    const id = code+'_'+hash(plain);
    if(seen.has(id)) return; seen.add(id);
    out.push({id, level, cat, t, en, plain});
  });
  return out;
}
const CHUNKS = { de: parseChunks(RAW_DE,'de') };
const BY_ID = {}; Object.values(CHUNKS).flat().forEach(c=>BY_ID[c.id]=c);

/* Build the level path: 100 chunks per part, mixed evenly across topics,
   most essential chunks first. Slang stays in its own category. */
const PATHS = {};
function pathFor(code){
  if(PATHS[code]) return PATHS[code];
  const list = CHUNKS[code]||[], res={};
  LEVELS.forEach(L=>{
    const pools = CATS.filter(c=>!c.slang).map(c=>list.filter(x=>x.cat===c.id && x.level===L.id));
    const need = L.parts*PART_SIZE, picked=[]; let i=0;
    while(picked.length<need && pools.some(p=>p.length>i)){ pools.forEach(p=>{ if(p[i] && picked.length<need) picked.push(p[i]) }); i++ }
    res[L.id] = Array.from({length:L.parts},(_,k)=>picked.slice(k*PART_SIZE,(k+1)*PART_SIZE)).filter(p=>p.length);
  });
  return PATHS[code]=res;
}

/* ---------- days, streak, spaced repetition ---------- */
function dayKey(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
const todayCount = () => state.activity[dayKey()]||0;
function streak(){ let n=0; const d=new Date(); if(!state.activity[dayKey(d)]) d.setDate(d.getDate()-1); while(state.activity[dayKey(d)]){ n++; d.setDate(d.getDate()-1) } return n }
const INTERVALS = [0,1,3,7,14,30,60,120];
function review(id, grade){
  const c = state.cards[id] || {box:0, due:0, reps:0};
  if(grade==='again'){ c.box=0; c.due=Date.now()+10*60e3 }
  else { c.box=Math.min(c.box+(grade==='easy'?2:1), INTERVALS.length-1); c.due=Date.now()+INTERVALS[c.box]*864e5 }
  c.reps++; c.last=Date.now(); state.cards[id]=c;
  state.activity[dayKey()] = todayCount()+1;
  save();
}
const boxOf = id => state.cards[id]?.box || 0;

const pct = items => items.length ? Math.round(learned(items)/items.length*100) : 0;

function pathOrder(){ const p=pathFor(state.lang); return LEVELS.flatMap(L=>(p[L.id]||[]).flat()) }
const newList = () => { const seen=new Set(), out=[]; [...pathOrder(), ...chunks()].forEach(c=>{ if(!seen.has(c.id) && !state.cards[c.id]){ seen.add(c.id); out.push(c) } }); return out };
const smartItems = () => [...dueList().slice(0,30), ...newList().slice(0,state.settings.newPerDay)];
const favItems = () => state.favs.map(id=>BY_ID[id]).filter(c=>c && c.id.startsWith(state.lang+'_'));

function filterSelect(items, f){
  const counts = {all:items.length}; [0,1,2,3].forEach(n=>counts[n]=items.filter(c=>starsOf(c.id)===n).length);

}

  no:[['no_NO-talesyntese-medium','Talesyntese (Norwegian)']],
  hr:[]
};
const piperVoiceFor = L => { const list=PIPER_VOICES[L.code]||[]; const v=state.settings.piperVoice[L.code]; return list.find(x=>x[0]===v)?v:(list[0]?.[0]||null) };

const PIPER = {
  mod:null, session:null, voice:null, loadingVoice:null, progress:0, error:null, queue:Promise.resolve(),
  async load(voiceId){
    if(this.session && this.voice===voiceId) return this.session;
    this.loadingVoice=voiceId; this.progress=0; this.error=null; voiceUI();
    try{
      if(!this.mod) this.mod = await import(PIPER_LIB);
      this.mod.TtsSession._instance = null;
      const s = await this.mod.TtsSession.create({voiceId, wasmPaths:PIPER_WASM, progress:p=>{
        if(p && p.total && !String(p.url||'').includes('inference')){ this.progress=Math.round(p.loaded/p.total*100); voiceUI() }
      }});
      this.session=s; this.voice=voiceId; state.voiceReady[voiceId]=true; save();
      return s;
    }catch(e){ this.error=e; throw e }
    finally{ this.loadingVoice=null; voiceUI() }
  },
  run(fn){ const r=this.queue.then(fn); this.queue=r.catch(()=>{}); return r },
  predict(text, voiceId){ return this.run(async()=>(await this.load(voiceId)).predict(text)) },
  warm(){ const v=piperVoiceFor(curLang()); if(state.settings.provider==='builtin' && v) this.run(()=>this.load(v)).catch(()=>{}) }
};
function voiceStatus(){
  const v=piperVoiceFor(curLang());
  if(!v) return curLang().name+' has no built-in voice yet (device voice is used)';
  if(PIPER.loadingVoice===v) return state.voiceReady[v] ? 'Loading voice…' : `Downloading voice… ${PIPER.progress}% (one time only)`;
  if(PIPER.session && PIPER.voice===v) return 'Voice ready';
  if(PIPER.error) return 'Voice could not load. Check your connection.';
  return state.voiceReady[v] ? 'Downloaded' : 'Not downloaded yet';
}
function voiceUI(){
  document.querySelectorAll('.vstatus').forEach(el=>el.textContent=voiceStatus());
  const b=document.getElementById('vbanner');
  if(b && !PIPER.loadingVoice && PIPER.session && PIPER.voice===piperVoiceFor(curLang())) b.remove();
  const ps=document.getElementById('pstatus');
  if(ps && P.on){ if(PIPER.loadingVoice) ps.textContent=voiceStatus(); else if(/Download|Loading/.test(ps.textContent)) ps.textContent='Listen…' }
}

const PROVIDERS = {
  builtin:{label:'Fluently voice (built in, free)', info:'A natural neural voice that runs inside the app. No key or account needed, and it sounds the same on every device. It downloads once, then works offline.'},
  browser:{label:'Device voice (lower quality)', info:'Uses the voices built into this device. Works offline, but quality varies by phone and computer.'},
  openai:{label:'OpenAI (needs API key)', info:'Very natural, and one voice speaks every language. Create a key at platform.openai.com, then API keys.'},
  elevenlabs:{label:'ElevenLabs (needs API key)', info:'The most lifelike voices. Multilingual v2 speaks all of your languages. Key from elevenlabs.io, Profile, API keys.'},
  google:{label:'Google Cloud (needs API key)', info:'A native voice for each language. Enable the Text-to-Speech API in Google Cloud, then create an API key.'},
  proxy:{label:'My own voice server', info:'Point the app at your own server (for example a free Cloudflare Worker) that keeps an API key secret.'}
};
const OPENAI_VOICES = ['alloy','ash','ballad','coral','echo','fable','nova','onyx','sage','shimmer','verse'];
const defGoogleVoice = L => L.bcp + '-Chirp3-HD-Aoede';
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
function b64blob(b64, type='audio/mpeg'){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type}) }

async function fetchTTS(text){
  const s = state.settings, L = curLang();
  const key = k => { if(!s.keys[k]) throw new Error('Add your '+k+' API key in Settings'); return s.keys[k].trim() };
  if(s.provider==='builtin'){
    const v = piperVoiceFor(L);
    if(!v) throw new Error(L.name+' has no built-in voice yet, so the device voice is used');
    return await PIPER.predict(text, v);
  }
  let r;
  if(s.provider==='openai'){
    r = await fetch('https://api.openai.com/v1/audio/speech', {method:'POST', headers:{'Authorization':'Bearer '+key('openai'),'Content-Type':'application/json'},
      body:JSON.stringify({model:'gpt-4o-mini-tts', voice:s.openaiVoice, input:text, response_format:'mp3', instructions:`Speak natural, native ${L.name}. Warm, clear and conversational.`})});
  } else if(s.provider==='elevenlabs'){
    r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(s.elevenVoice.trim())}?output_format=mp3_44100_128`, {method:'POST',
      headers:{'xi-api-key':key('elevenlabs'),'Content-Type':'application/json','Accept':'audio/mpeg'},
      body:JSON.stringify({text, model_id:'eleven_multilingual_v2', voice_settings:{stability:0.5, similarity_boost:0.75}})});
  } else if(s.provider==='google'){
    r = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize', {method:'POST', headers:{'X-Goog-Api-Key':key('google'),'Content-Type':'application/json'},
      body:JSON.stringify({input:{text}, voice:{languageCode:L.bcp, name:(s.googleVoice||defGoogleVoice(L)).trim()}, audioConfig:{audioEncoding:'MP3'}})});
  } else if(s.provider==='proxy'){
    if(!s.proxyUrl) throw new Error('Add your voice server URL in Settings');
    r = await fetch(s.proxyUrl.trim(), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, lang:L.code, bcp:L.bcp})});
  }
  if(!r.ok){ let m=''; try{ m=(await r.text()).slice(0,140) }catch(e){} throw new Error(`Voice error ${r.status}${m?': '+m:''}`) }
  const ct = r.headers.get('content-type')||'';
  if(ct.includes('json')){ const j=await r.json(); if(j.audioContent) return b64blob(j.audioContent); throw new Error('Unexpected voice response') }
  return await r.blob();
}

function bestVoice(bcp){
  if(!('speechSynthesis' in window)) return null;
  const base=bcp.split('-')[0].toLowerCase(), norm=v=>v.lang.replace('_','-').toLowerCase();
  const score=v=>(/natural|neural|premium|enhanced|siri/i.test(v.name)?10:0)+(/google/i.test(v.name)?5:0)+(norm(v)===bcp.toLowerCase()?3:0);
  return speechSynthesis.getVoices().filter(v=>norm(v).startsWith(base)).sort((a,b)=>score(b)-score(a))[0]||null;
}
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices() }catch(e){} }
const setSpeaking = on => document.body.classList.toggle('speaking', on);

const TTS = {
  audio:new Audio(), mem:new Map(), pending:new Map(), _done:null, lastErr:0,
  cacheKey(text){
    const s=state.settings, L=curLang();
    const v={builtin:piperVoiceFor(L), openai:s.openaiVoice, elevenlabs:s.elevenVoice, google:s.googleVoice||defGoogleVoice(L), proxy:s.proxyUrl}[s.provider]||'';
    return [s.provider,v,L.bcp,text].join('|');
  },
  url(text){
    const k=this.cacheKey(text);
    if(this.mem.has(k)) return Promise.resolve(this.mem.get(k));
    if(this.pending.has(k)) return this.pending.get(k);
    const p=(async()=>{
      let store=null; const req=new Request('https://fluently.local/tts/'+hash(k)+'-'+hash(k.split('').reverse().join('')));
      try{ if(window.caches){ store=await caches.open('fluently-tts-v1'); const hit=await store.match(req); if(hit) return URL.createObjectURL(await hit.blob()) } }catch(e){}
      const blob=await fetchTTS(text);
      try{ if(store) await store.put(req,new Response(blob,{headers:{'Content-Type':blob.type||'audio/mpeg'}})) }catch(e){}
      return URL.createObjectURL(blob);
    })();
    this.pending.set(k,p);
    return p.then(u=>{ this.mem.set(k,u); this.pending.delete(k); return u }, e=>{ this.pending.delete(k); throw e });
  },
  prefetch(text){ if(text && state.settings.provider!=='browser') this.url(text).catch(()=>{}) },
  stop(){
    try{ this.audio.pause() }catch(e){}
    try{ if('speechSynthesis' in window) speechSynthesis.cancel() }catch(e){}
    if(this._done){ const d=this._done; this._done=null; d() }
    setSpeaking(false);
  },
  speak(text,{rate=1}={}){
    this.stop();
    const s=state.settings;
    return new Promise(async res=>{
      let finished=false;
      const done=()=>{ if(finished) return; finished=true; if(this._done===done) this._done=null; setSpeaking(false); res() };
      this._done=done; setSpeaking(true);
      if(s.provider==='browser') return this.browser(text,rate,done);
      try{
        const u=await this.url(text);
        if(this._done!==done) return;
        const a=this.audio; a.src=u; a.playbackRate=s.speed*rate; a.preservesPitch=true; a.webkitPreservesPitch=true;
        a.onended=done; a.onerror=done;
        await a.play();
      }catch(err){
        if(this._done!==done) return;
        this.warn(err); this.browser(text,rate,done);
      }
    });
  },
  browser(text,rate,done){
    if(!('speechSynthesis' in window)){ done(); return }
    const L=curLang(), u=new SpeechSynthesisUtterance(text);
    u.lang=L.bcp; const v=bestVoice(L.bcp); if(v) u.voice=v;
    u.rate=Math.max(.5,Math.min(1.5,state.settings.speed*rate*.95));
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  },
  warn(err){ const m=String(err&&err.message||''); const friendly = state.settings.provider==='builtin' ? (/no built-in voice/.test(m)?m:'The voice is still loading or offline, so the device voice is used for now') : (m.length<90&&m?m:'Voice error, so the device voice is used'); if(Date.now()-this.lastErr>8000) toast(friendly); this.lastErr=Date.now() }
};
/* Unlock audio on the first real tap (required on iPhone/iPad) */
let unlocked=false;
function unlockAudio(){ if(unlocked) return; unlocked=true; try{ TTS.audio.src=SILENT; const p=TTS.audio.play(); if(p) p.catch(()=>{ unlocked=false }) }catch(e){ unlocked=false } }
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

function learnList(){
  const q=query.trim().toLowerCase();
  if(q){
    const res=chunks().filter(c=>c.plain.toLowerCase().includes(q)||c.en.toLowerCase().includes(q)).slice(0,60);
    return res.length ? `<div class="label" style="margin-top:4px">${res.length}${res.length===60?'+':''} results</div>${res.map(c=>chunkCard(c,{showLevel:true})).join('')}` : emptyBox('search','No results',`Nothing matches “${esc(query)}”.`);
  }
  if(state.learnMode==='level'){
    const path=pathFor(state.lang);
    return LEVELS.map(Lv=>{
      const parts=path[Lv.id]||[], all=parts.flat();
      return `<div class="card lvcard">
        <div class="lvhead">${lvSq(Lv.id,'lg')}<div class="t"><b>${Lv.id} · ${Lv.name}</b><p>${Lv.desc}</p><p style="font-weight:700;margin-top:4px">${all.length} chunks · ${pct(all)}% learned</p></div></div>
        <div class="parts ${parts.length===1?'one':''}">${parts.map((pt,i)=>{ const q=pct(pt); return `<button class="part ${q>=80?'done':''}" data-act="open" data-key="lvl:${Lv.id}:${i+1}"><b>${parts.length>1?'Part '+(i+1):'All '+pt.length+' chunks'}</b><span>${q}% learned</span><div class="bar"><i style="width:${q}%;background:${Lv.color}"></i></div></button>` }).join('')}</div>
      </div>`;
    }).join('');
  }
  return CATS.map(c=>{ const it=chunks().filter(x=>x.cat===c.id), q=pct(it);
    return `<button class="lrow" data-act="open" data-key="cat:${c.id}">${catSq(c)}<div class="b"><b>${c.name}</b><span>${it.length} chunks · ${q}% learned</span><div class="bar"><i style="width:${q}%;background:${c.color}"></i></div></div>${ic('chev',18).replace('<svg','<svg class="chev"')}</button>` }).join('');
}

   ===================================================================== */
const P = {on:false, loopId:0};
const alive = id => P.on && P.auto && id===P.loopId;
function status(t){ const el=$('#pstatus'); if(el) el.textContent=t||'' }

function startSession(items,{title,key=null,mode='listen',start=0}){
  if(!items.length){ toast('Nothing to practice here yet'); return }
  stopAuto(); TTS.stop();
  Object.assign(P,{on:true,items,idx:Math.min(start,items.length-1),mode,title,key,revealed:mode==='listen',showEn:false,auto:false,done:false,count:0});
  if(key) touchRecent();
  renderPlayer();
  $('#player').classList.add('open'); $('#player').setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');
  if(mode==='listen') setTimeout(playCurrent,350);
}
function touchRecent(){
  if(!P.key) return;
  state.recent=state.recent.filter(r=>!(r.key===P.key&&r.lang===state.lang));
  state.recent.unshift({key:P.key,lang:state.lang,idx:P.done?P.items.length:P.idx,total:P.items.length,ts:Date.now()});
  state.recent=state.recent.slice(0,10); save();
}
function closePlayer(){
  stopAuto(); TTS.stop(); P.on=false;
  $('#player').classList.remove('open'); $('#player').setAttribute('aria-hidden','true');
  document.body.classList.remove('noscroll'); render();
}
function starRow(id,size=24){ const st=starsOf(id); return [1,2,3].map(n=>`<button class="${n<=st?'on':''}" data-act="rate" data-id="${id}" data-n="${n}" aria-label="${n} star${n>1?'s':''}">${ic('star',size)}</button>`).join('') }

function renderPlayer(){
  const el=$('#player');
  if(P.done){
    const t=todayCount(), g=state.settings.dailyGoal, p=Math.min(100,Math.round(t/g*100));
    el.innerHTML=`<div class="pw"><div class="ptop"><button class="iconbtn" data-act="pclose" aria-label="Close">${ic('x')}</button><div class="t"><b>${esc(P.title)}</b><div class="bar"><i style="width:100%"></i></div></div></div>
      <div class="pend"><div class="ei">${ic('party',40)}</div><h2>Session complete</h2><p class="muted">You practiced ${P.count} sentence${P.count===1?'':'s'}.</p>
      <div class="card" style="display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;text-align:left">${ring(p,56,6,'var(--blue-2)','var(--card-2)')}<div><b>Today's goal</b><p class="muted">${t} / ${g} sentences</p></div></div>
      <div class="row-btns"><button class="btn plain" data-act="again">${ic('loop',18)} Again</button><button class="btn primary" data-act="pclose">Done</button></div></div></div>`;
    return;
  }
  const c=P.items[P.idx], cat=CATS.find(x=>x.id===c.cat), listen=P.mode==='listen', showDe=listen||P.revealed, fav=state.favs.includes(c.id);
  const showEn = listen ? (state.settings.showEn||P.showEn) : true;
  el.innerHTML=`<div class="pw">
    <div class="ptop"><button class="iconbtn" data-act="pclose" aria-label="Close">${ic('x')}</button>
      <div class="t"><b>${esc(P.title)}</b><div class="bar"><i style="width:${P.idx/P.items.length*100}%"></i></div></div><span class="n">${P.idx+1}/${P.items.length}</span></div>
    <div class="seg" style="margin:0 0 14px"><button class="${listen?'on':''}" data-act="pmode" data-m="listen">${ic('headphones',17)} Listen</button><button class="${!listen?'on':''}" data-act="pmode" data-m="recall">${ic('eye',17)} Recall</button></div>
    <div class="pcard">
      <div class="ptags"><span class="tagl" style="--c:${LVC[c.level]}">${c.level}</span><span class="tag">${ic(cat.icon,13)} ${cat.name}</span>
        <button class="heart ${fav?'on':''}" data-act="fav" data-id="${c.id}" aria-label="Favorite">${ic('heart',22)}</button></div>
      ${!listen?`<div class="pen big">${esc(c.en)}</div>`:''}
      ${showDe?`<div class="pde">${hl(c.t)}</div>`:`<div class="phide">Say it in ${curLang().name}…</div>`}
      ${listen?(showEn?`<div class="pen">${esc(c.en)}</div>`:`<button class="link" data-act="showen">Show translation</button>`):''}
      ${!showDe?`<button class="btn primary" style="flex:none;padding:0 24px" data-act="reveal">${ic('eye',19)} Reveal &amp; listen</button>`:''}
      <div class="stars prate" role="group" aria-label="Rate">${starRow(c.id)}</div>
      <div class="pstatus" id="pstatus" aria-live="polite"></div>
    </div>
    <div class="pctl">
      <button class="ctl" data-act="pprev" aria-label="Previous">${ic('prev',20)}</button>
      <button class="ctl" data-act="pslow" aria-label="Play slowly">${ic('snail',22)}</button>
      <button class="ctl big" data-act="pplay" aria-label="Play">${ic('play',32)}</button>
      <button class="ctl" data-act="pauto" aria-label="Hands-free" style="${P.auto?'color:var(--blue-2);border-color:var(--blue-2)':''}">${ic(P.auto?'pause':'loop',20)}</button>
      <button class="ctl" data-act="pnext" aria-label="Next">${ic('next',20)}</button>
    </div>
    <div class="pauto"><span class="muted small">${P.auto?'Hands-free is on: listen, repeat, next':'Tap the loop button for hands-free mode'}</span></div>
    <div class="grade">
      <button class="g1" data-act="grade" data-g="again">Again<small>show sooner</small></button>
      <button class="g2" data-act="grade" data-g="good">Got it<small>normal</small></button>
      <button class="g3" data-act="grade" data-g="easy">Easy<small>show later</small></button>
    </div>
  </div>`;
  TTS.prefetch(c.plain); TTS.prefetch(P.items[P.idx+1]?.plain);
}

async function playCurrent(rate=1){
  if(!P.on||P.done) return;
  const c=P.items[P.idx];
  if(P.mode==='recall'&&!P.revealed){ P.revealed=true; renderPlayer() }
  status(rate<1?'Playing slowly…':'Listen…');
  await TTS.speak(c.plain,{rate});
  if(P.on&&P.items[P.idx]===c&&!P.auto) status('Now say it out loud');
}
function goTo(i){ if(i<0) return; if(i>=P.items.length){ finish(); return } P.idx=i; P.revealed=P.mode==='listen'; P.showEn=false; touchRecent(); renderPlayer() }
function next(autoPlay=true){ goTo(P.idx+1); if(autoPlay&&P.on&&!P.done&&P.mode==='listen'&&!P.auto) setTimeout(playCurrent,250) }
function finish(){ stopAuto(); TTS.stop(); P.done=true; touchRecent(); renderPlayer() }
function stopAuto(){ if(P.auto){ P.auto=false; P.loopId++; TTS.stop(); if(P.on) renderPlayer() } }
async function autoLoop(){
  const id=++P.loopId; P.auto=true; renderPlayer();
  const s=state.settings;
  while(alive(id)&&!P.done){
    const c=P.items[P.idx];
    if(P.mode==='recall'){ P.revealed=false; renderPlayer(); status('Say it in '+curLang().name+'…'); await wait(s.gap*1000+1500); if(!alive(id)) return; P.revealed=true; renderPlayer() }
    for(let r=0;r<s.repeats;r++){ status('Listen…'); await TTS.speak(c.plain); if(!alive(id)) return; status('Your turn: repeat it'); await wait(s.gap*1000); if(!alive(id)) return }
    review(c.id,'good'); P.count++;
    if(!s.autoNext){ stopAuto(); status('Tap play or grade to continue'); return }
    if(P.idx>=P.items.length-1){ finish(); return }
    P.idx++; P.revealed=P.mode==='listen'; touchRecent(); renderPlayer();
  }
}

    ${LANGS.map(l=>`<button class="langrow ${l.code===state.lang?'on':''}" data-act="pickLang" data-code="${l.code}">${flag(l.code,32)}<div class="b"><b>${l.name}</b><span>${l.native}</span></div>${l.ready?(l.code===state.lang?ic('check'):''):'<span class="soon">Coming soon</span>'}</button>`).join('')}</div>`;
  requestAnimationFrame(()=>$('#sheet').classList.add('open'));
}
const closeSheet=()=>$('#sheet').classList.remove('open');
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3000) }

function sayBtn(el){
  const c=BY_ID[el.dataset.id]; if(!c) return;
  document.querySelectorAll('.play.playing').forEach(b=>b.classList.remove('playing'));
  el.classList.add('playing');
  TTS.speak(c.plain).then(()=>el.classList.remove('playing'));
}
function setStars(id,n){
  const cur=starsOf(id), v=(cur===n)?0:n;
  if(v) state.stars[id]=v; else delete state.stars[id];
  save();
  document.querySelectorAll(`.stars button[data-id="${id}"]`).forEach(b=>{ const k=Number(b.dataset.n); b.classList.toggle('on',k<=v); b.classList.remove('pop'); if(k===n){ void b.offsetWidth; b.classList.add('pop') } });
  refreshFilterCounts();
}
function toggleFav(id){
  const i=state.favs.indexOf(id), on=i<0;
  if(on){ state.favs.unshift(id); toast('Added to favorites') } else state.favs.splice(i,1);
  save();
  document.querySelectorAll(`.heart[data-id="${id}"]`).forEach(b=>{ b.classList.toggle('on',on); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop') });
  if(nav.tab==='favs' && !curView() && !on && !P.on){ const card=document.querySelector(`.chunk[data-cid="${id}"]`); if(card) card.remove(); if(!favItems().length) render() }
}
function refreshFilterCounts(){
  const sel=document.querySelector('select[data-filter]'); if(!sel) return;
  const v=curView()||(nav.tab==='favs'?nav.favView:null); if(!v) return;
  const items = v.view==='set' ? setInfo(v.key).items : favItems();
  const cnt={all:items.length}; [0,1,2,3].forEach(n=>cnt[n]=items.filter(c=>starsOf(c.id)===n).length);
  [...sel.options].forEach((o,i)=>{ const [val,l]=FILTERS[i]; o.textContent=`${l} (${cnt[val==='all'?'all':Number(val)]})` });
}
function activeListView(){ return curView() || (nav.tab==='favs'?nav.favView:null) }

const ACT = {
  go: el=>go(el.dataset.tab), back, lang:openLang, closeSheet,
  theme: ()=>setTheme(isDark()?'light':'dark'),
  themeSet: el=>setTheme(el.dataset.t),
  pickLang: el=>{ const l=LANGS.find(x=>x.code===el.dataset.code); if(!l.ready){ toast(l.name+' is coming soon!'); return } state.lang=l.code; save(); closeSheet(); render(); PIPER.warm() },
  useBuiltin: ()=>{ state.settings.provider='builtin'; save(); render(); PIPER.warm() },
  'learn-level': ()=>{ state.learnMode='level'; save(); go('learn') },
  'learn-cat': ()=>{ state.learnMode='cat'; save(); go('learn') },
  lmode: el=>{ state.learnMode=el.dataset.m; save(); render() },
  open: el=>push({view:'set',key:el.dataset.key,filter:'all'}),
  more: ()=>{ const v=activeListView(); if(!v) return; const y=window.scrollY; v.limit=(v.limit||LIST_STEP)+LIST_STEP; render(); window.scrollTo(0,y) },
  start: el=>{ const v=curView(), s=setInfo(v.key), items=applyFilter(s.items,v.filter); startSession(items,{title:s.title+(v.filter&&v.filter!=='all'?' · '+FILTERS.find(f=>f[0]===v.filter)[1]:''), key:(!v.filter||v.filter==='all')?v.key:null, mode:el.dataset.mode}) },
  startFav: el=>{ const v=nav.favView||{}, items=applyFilter(favItems(),v.filter); startSession(items,{title:'Favorites', key:(!v.filter||v.filter==='all')?'fav':null, mode:el.dataset.mode}) },
  resume: el=>{ const r=state.recent.find(x=>x.key===el.dataset.key&&x.lang===state.lang), s=setInfo(el.dataset.key); startSession(s.items,{title:s.title,key:el.dataset.key,start:r&&r.idx<s.items.length?r.idx:0}) },
  mix: ()=>startSession(shuffle(chunks()).slice(0,15),{title:'Random 15'}),
  smart: ()=>{ const it=smartItems(); it.length?startSession(it,{title:'Daily session'}):toast('All caught up!') },
  challenge: ()=>{ const it=shuffle(smartItems()); it.length?startSession(it,{title:'Speak test',mode:'recall'}):toast('All caught up!') },
  say: sayBtn,
  rate: el=>setStars(el.dataset.id,Number(el.dataset.n)),
  fav: el=>toggleFav(el.dataset.id),
  pclose: closePlayer,
  pplay: ()=>{ stopAuto(); playCurrent() },
  pslow: ()=>{ stopAuto(); playCurrent(.7) },
  pnext: ()=>{ stopAuto(); TTS.stop(); next() },
  pprev: ()=>{ stopAuto(); TTS.stop(); goTo(P.idx-1); if(P.mode==='listen') setTimeout(playCurrent,250) },
  pauto: ()=>{ if(P.auto) stopAuto(); else { TTS.stop(); autoLoop() } },
  pmode: el=>{ stopAuto(); TTS.stop(); P.mode=el.dataset.m; P.revealed=P.mode==='listen'; renderPlayer() },
  reveal: ()=>playCurrent(),
  showen: ()=>{ P.showEn=true; renderPlayer() },
  grade: el=>{ stopAuto(); TTS.stop(); review(P.items[P.idx].id,el.dataset.g); P.count++; next() },
  again: ()=>startSession(P.items,{title:P.title,key:P.key,mode:P.mode}),
  testVoice: async ()=>{ toast('Playing test…'); await TTS.speak('Hallo! Schön, dass du da bist. Lass uns zusammen Deutsch lernen.') },
  clearCache: async ()=>{ TTS.mem.clear(); try{ await caches.delete('fluently-tts-v1') }catch(e){} toast('Audio cache cleared') },
  resetData: ()=>{ if(!confirm('Reset all progress on this device?')) return; state.cards={}; state.stars={}; state.favs=[]; state.activity={}; state.recent=[]; save(); toast('Progress reset'); render() }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const fn=ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el) }
});

/* inputs */
function setPath(path,val){ const p=path.split('.'); let o=state.settings; while(p.length>1){ const k=p.shift(); o=o[k]=o[k]||{} } o[p[0]]=val }
const readInput = el => el.type==='checkbox' ? el.checked : el.dataset.num ? Number(el.value) : el.value;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='search'){ query=el.value; $('#learn-list').innerHTML=learnList(); return }
  if(el.dataset.set && el.type!=='checkbox' && el.tagName!=='SELECT'){
    setPath(el.dataset.set,readInput(el)); save();
    if(el.dataset.out){ const v=readInput(el); $('#'+el.dataset.out).textContent = el.dataset.fmt==='x' ? v.toFixed(2)+'×' : v+'s' }
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.filter){ const v=activeListView(); if(v){ v.filter=el.value; v.limit=LIST_STEP; render() } return }
  if(!el.dataset.set) return;
  setPath(el.dataset.set,readInput(el)); save();
  if(el.dataset.rerender) render();
  if(el.dataset.set==='provider'||el.dataset.set.startsWith('piperVoice')) PIPER.warm();
});
document.addEventListener('keydown',e=>{
  if(!P.on||P.done||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); ACT.pplay() }
  else if(e.key==='ArrowRight') ACT.pnext();
  else if(e.key==='ArrowLeft') ACT.pprev();
  else if(e.key==='Escape') closePlayer();
});

/* ---------- boot ---------- */
applyTheme();
render();
setTimeout(()=>PIPER.warm(),800);
</script>
</body>
</html>
