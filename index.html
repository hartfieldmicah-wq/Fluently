<style>
:root{
  --blue:#2563eb; --blue-2:#3b82f6; --blue-3:#60a5fa; --blue-deep:#1e40af;
  --blue-soft:rgba(37,99,235,.10);
  --glow:0 0 0 1px rgba(59,130,246,.35),0 8px 28px -6px rgba(37,99,235,.55);
  --glow-strong:0 0 0 1px rgba(96,165,250,.5),0 12px 40px -8px rgba(37,99,235,.8);
  --r:18px; --nav-h:68px;
  --bg:#f7f8fb; --card:#ffffff; --card-2:#f1f3f8; --line:#e3e7ef;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --mark-bg:rgba(37,99,235,.12); --mark:#1d4ed8;
  --star:#f59e0b; --heart:#ef4444;
}
:root[data-theme="dark"]{
  --bg:#1c1d21; --card:#26282e; --card-2:#2f3239; --line:#363942;
  --text:#f1f3f7; --muted:#9ba3b4; --faint:#6b7280;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --blue-soft:rgba(59,130,246,.16);
  --mark-bg:rgba(96,165,250,.18); --mark:#93c5fd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;transition:background .2s,color .2s}
body.noscroll{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[data-act]{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
svg{display:block;flex-shrink:0}
.muted{color:var(--muted)} .small{font-size:13px}
mark{background:var(--mark-bg);color:var(--mark);border-radius:5px;padding:0 3px;font-weight:700}

#app{max-width:640px;margin:0 auto}
.screen{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 36px);animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack > * + *{margin-top:10px}
.label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
.label a,.label button{letter-spacing:0;text-transform:none;font-size:14px;color:var(--blue-2);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;white-space:nowrap;transition:transform .12s,box-shadow .2s;flex:1}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;box-shadow:var(--glow)}
.btn.soft{background:var(--blue-soft);color:var(--blue-2)}
:root[data-theme="light"] .btn.soft{color:var(--blue)}
.btn.plain{background:var(--card-2);border:1px solid var(--line)}
.btn.white{background:#fff;color:var(--blue-deep)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.danger{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;flex:none;padding:0 14px}
.row-btns{display:flex;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex-shrink:0;transition:transform .12s}
.iconbtn:active{transform:scale(.93)}

/* progress */
.bar{height:6px;background:var(--card-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-3));transition:width .4s}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello h1{font-size:28px}
.hello p{color:var(--muted);font-size:14px;margin-top:2px}
.langchip{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.flag{display:inline-block;border-radius:5px;overflow:hidden;line-height:0;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.top-actions{display:flex;gap:8px;align-items:center}

/* hero session card */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#60a5fa 0%,#2563eb 38%,#1e3a8a 100%);box-shadow:var(--glow-strong)}
.hero::before{content:"";position:absolute;inset:auto -30% -60% auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero-top{display:flex;align-items:center;gap:16px;position:relative}
.hero-top .t{flex:1;min-width:0}
.hero small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.hero h2{font-size:22px;margin-top:4px}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .row-btns{margin-top:18px;position:relative}
.ring{position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px}
.pills{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700}

/* list rows */
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .12s}
.lrow:active{transform:scale(.985)}
.lrow + .lrow{margin-top:10px}
.lrow .b{flex:1;min-width:0}
.lrow .b b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .b span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lrow .b .bar{margin-top:8px}
.lrow > .chev{color:var(--faint)}
.sq{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--c,var(--blue));box-shadow:0 6px 16px -8px var(--c,var(--blue))}
.sq.lv{font-weight:900;font-size:16px;letter-spacing:-.02em}
.sq.lg{width:56px;height:56px;border-radius:16px}
.playdot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2);flex-shrink:0}

/* explore */
.explore{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:transform .12s;min-height:132px}
.ex:active{transform:scale(.97)}
.ex b{font-size:16px}
.ex span{font-size:13px;color:var(--muted)}
.ex.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
.ex.wide > div{flex:1}

/* segmented */
.seg{display:flex;padding:4px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);margin:14px 0 16px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .18s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:#3a3e47}
.seg button.on svg{color:var(--blue-2)}

.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.pagehead{margin-bottom:6px}
.pagehead h1{font-size:30px}
.pagehead p{color:var(--muted);margin-top:4px}

/* level cards with parts */
.lvcard{padding:16px}
.lvcard + .lvcard{margin-top:12px}
.lvhead{display:flex;align-items:center;gap:14px}
.lvhead .t{flex:1;min-width:0}
.lvhead b{font-size:17px}
.lvhead p{font-size:13px;color:var(--muted);margin-top:2px}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.parts.one{grid-template-columns:1fr}
.part{padding:10px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);text-align:left;transition:transform .12s,border-color .2s}
.part:active{transform:scale(.96)}
.part b{display:block;font-size:14px}
.part span{display:block;font-size:11px;color:var(--muted);margin:2px 0 6px}
.part .bar{height:4px}
.part.done{border-color:rgba(59,130,246,.55)}

/* set view */
.subhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.subhead .t{flex:1;min-width:0}
.subhead h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subhead p{font-size:13px;color:var(--muted);margin-top:1px}
.summary{display:flex;align-items:center;gap:14px}
.summary .t{flex:1;min-width:0}
.summary .t p{font-size:14px;color:var(--muted)}
.summary .meta{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 8px}
.filterbar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.filterbar .lbl{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.select{position:relative;flex:1}
.select select{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;padding:0 38px 0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px;outline:0}
.select select:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px var(--blue-soft)}
.select svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}

/* chunk card */
.chunk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px 12px;box-shadow:var(--shadow)}
.chunk + .chunk{margin-top:10px}
.chunk .main{display:flex;gap:12px;align-items:flex-start}
.chunk .txt{flex:1;min-width:0;padding-top:2px}
.de{font-size:17px;font-weight:600;line-height:1.35}
.en{font-size:14px;color:var(--muted);margin-top:3px}
.chunk .foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-left:50px}
.tagl{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;color:#fff;background:var(--c)}
.stars{display:flex;align-items:center}
.stars button{width:34px;height:34px;display:grid;place-items:center;color:var(--faint);border-radius:10px}
.stars button.on{color:var(--star)}
.stars button.on svg{fill:var(--star)}
.heart{width:40px;height:36px;display:grid;place-items:center;color:var(--faint);border-radius:10px;margin-left:auto}
.heart.on{color:var(--heart)}
.heart.on svg{fill:var(--heart)}
.heart.pop svg,.stars button.pop svg{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.play{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;flex-shrink:0;box-shadow:0 4px 12px -3px rgba(37,99,235,.7);transition:transform .12s}
.play:active{transform:scale(.9)}
.play.playing{animation:ping 1s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}100%{box-shadow:0 0 0 14px rgba(59,130,246,0)}}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--blue-soft);color:var(--blue-2);display:grid;place-items:center;margin:0 auto 12px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.more{display:block;width:100%;margin-top:12px}

/* progress page */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px}
.tile .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2)}
.tile b{display:block;font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.week{display:flex;gap:8px;align-items:flex-end;height:140px;margin-top:14px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.wk .col{flex:1;width:100%;background:var(--card-2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wk .col i{display:block;width:100%;border-radius:8px;background:linear-gradient(180deg,var(--blue-3),var(--blue))}
.wk span{font-size:11px;color:var(--muted);font-weight:700}
.wk.today span{color:var(--blue-2)}
.lp{display:flex;align-items:center;gap:12px;margin-top:14px}
.lp .sq{width:36px;height:36px;border-radius:11px;font-size:13px}
.lp > div{flex:1}
.lp .tp{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}

/* settings */
.sgroup{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 4px 10px}
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:first-child{padding-top:0}
.field:last-child{border-bottom:0;padding-bottom:0}
.field .fl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.field .desc{font-size:13px;color:var(--muted);margin-top:6px}
.inp{width:100%;min-height:46px;margin-top:10px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);font-size:16px;outline:0}
.inp.code{min-height:96px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical;word-break:break-all}
.inp:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px var(--blue-soft)}
.field .select{margin-top:10px}
.field .select.inline{margin-top:0;flex:none;min-width:130px}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--blue)}
.switch{position:relative;width:52px;height:32px;flex-shrink:0;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--card-2);border:1px solid var(--line);transition:.2s}
.switch span::before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}
.switch input:checked + span{background:var(--blue);border-color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.55)}
.switch input:checked + span::before{transform:translateX(20px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themes button{padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.themes button.on{border-color:var(--blue-2);background:var(--blue-soft);color:var(--blue-2);box-shadow:var(--glow)}
.note{background:var(--blue-soft);border-radius:12px;padding:12px;font-size:13px;margin-top:12px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--blue-2)}
pre{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;margin-top:8px}

/* nav: floating dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
.dock-in{pointer-events:auto;max-width:520px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;justify-content:space-around;border-radius:22px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(15,23,42,.25);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
:root[data-theme="dark"] .dock-in{background:rgba(38,40,46,.92);box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.dock button{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:700}
.dock .di{width:40px;height:32px;border-radius:12px;display:grid;place-items:center;transition:all .2s}
.dock button.on{color:var(--blue-2)}

    while(picked.length<need && pools.some(p=>p.length>i)){ pools.forEach(p=>{ if(p[i] && picked.length<need) picked.push(p[i]) }); i++ }

  fr:[['fr_FR-siwis-medium','Siwis (female)'],['fr_FR-tom-medium','Tom (male)']],
  es:[['es_ES-davefx-medium','Dave (male)'],['es_ES-sharvard-medium','Sharvard']],

  en:[['en_US-hfc_female-medium','Hannah (female)'],['en_US-ryan-high','Ryan · best quality (male)'],['en_US-lessac-medium','Lessac (female)']],
  es419:[['es_MX-claude-high','Claude · best quality (Mexico)'],['es_MX-ald-medium','Ald (Mexico)']],
  sw:[['sw_CD-lanfrica-medium','Lanfrica']],

const piperVoiceFor = L => { const list=PIPER_VOICES[L.code]||[]; const v=state.settings.piperVoice[L.code]; return list.find(x=>x[0]===v)?v:(list[0]?.[0]||null) };

const PIPER = {
  mod:null, session:null, voice:null, loadingVoice:null, progress:0, error:null, queue:Promise.resolve(),
  async load(voiceId){
    if(this.session && this.voice===voiceId) return this.session;
    this.loadingVoice=voiceId; this.progress=0; this.error=null; voiceUI();
    try{
      if(!this.mod) this.mod = await import(PIPER_LIB);
      this.mod.TtsSession._instance = null;
      const s = await this.mod.TtsSession.create({voiceId, wasmPaths:PIPER_WASM, progress:p=>{
        if(p && p.total && !String(p.url||'').includes('inference')){ this.progress=Math.round(p.loaded/p.total*100); voiceUI() }
      }});
      this.session=s; this.voice=voiceId; state.voiceReady[voiceId]=true; save();
      return s;
    }catch(e){ this.error=e; throw e }
    finally{ this.loadingVoice=null; voiceUI() }
  },
  run(fn){ const r=this.queue.then(fn); this.queue=r.catch(()=>{}); return r },
  predict(text, voiceId){ return this.run(async()=>(await this.load(voiceId)).predict(text)) },
  warm(){ const v=piperVoiceFor(curLang()); if(state.settings.provider==='builtin' && v) this.run(()=>this.load(v)).catch(()=>{}) }
};
function voiceStatus(){
  const v=piperVoiceFor(curLang());
  if(!v) return curLang().name+' has no built-in voice yet (device voice is used)';
  if(PIPER.loadingVoice===v) return state.voiceReady[v] ? 'Loading voice…' : `Downloading voice… ${PIPER.progress}% (one time only)`;
  if(PIPER.session && PIPER.voice===v) return 'Voice ready';
  if(PIPER.error) return 'Voice could not load. Check your connection.';
  return state.voiceReady[v] ? 'Downloaded' : 'Not downloaded yet';
}
function voiceUI(){
  document.querySelectorAll('.vstatus').forEach(el=>el.textContent=voiceStatus());
  const b=document.getElementById('vbanner');
  if(b && !PIPER.loadingVoice && PIPER.session && PIPER.voice===piperVoiceFor(curLang())) b.remove();
  const ps=document.getElementById('pstatus');
  if(ps && P.on){ if(PIPER.loadingVoice) ps.textContent=voiceStatus(); else if(/Download|Loading/.test(ps.textContent)) ps.textContent='Listen…' }
}

const PROVIDERS = {
  builtin:{label:'Fluently voice (built in, free)', info:'A natural neural voice that runs inside the app. No key or account needed, and it sounds the same on every device. It downloads once, then works offline.'},
  browser:{label:'Device voice (lower quality)', info:'Uses the voices built into this device. Works offline, but quality varies by phone and computer.'},
};
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
/* silent audio for pauses: keeps hands-free playing with the screen off or the app in the background */
const SIL={};
function silentUrl(ms){
  ms=Math.max(200,Math.round(ms/100)*100); if(SIL[ms]) return SIL[ms];
  const n=ms*8, b=new ArrayBuffer(44+n), v=new DataView(b), w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)) };
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  new Uint8Array(b,44).fill(128);
  return SIL[ms]=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function b64blob(b64, type='audio/mpeg'){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type}) }

async function fetchTTS(text){
  const s = state.settings, L = curLang();
  if(s.provider==='builtin'){
    const v = piperVoiceFor(L);
    if(!v) throw new Error(L.name+' has no built-in voice yet, so the device voice is used');
    return await PIPER.predict(text, v);
  }
  throw new Error('Device voice');
}

function bestVoice(bcp){
  if(!('speechSynthesis' in window)) return null;
  const base=bcp.split('-')[0].toLowerCase(), norm=v=>v.lang.replace('_','-').toLowerCase();
  const score=v=>(/natural|neural|premium|enhanced|siri/i.test(v.name)?10:0)+(/google/i.test(v.name)?5:0)+(norm(v)===bcp.toLowerCase()?3:0);
  return speechSynthesis.getVoices().filter(v=>norm(v).startsWith(base)).sort((a,b)=>score(b)-score(a))[0]||null;
}
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices() }catch(e){} }
const setSpeaking = on => document.body.classList.toggle('speaking', on);

const TTS = {
  audio:new Audio(), mem:new Map(), pending:new Map(), _done:null, lastErr:0,
  cacheKey(text){
    const s=state.settings, L=curLang();
    const v=s.provider==='builtin'?piperVoiceFor(L):'';
    return [s.provider,v,L.bcp,text].join('|');
  },
  url(text){
    const k=this.cacheKey(text);
    if(this.mem.has(k)) return Promise.resolve(this.mem.get(k));
    if(this.pending.has(k)) return this.pending.get(k);
    const p=(async()=>{
      let store=null; const req=new Request('https://fluently.local/tts/'+hash(k)+'-'+hash(k.split('').reverse().join('')));
      try{ if(window.caches){ store=await caches.open('fluently-tts-v1'); const hit=await store.match(req); if(hit) return URL.createObjectURL(await hit.blob()) } }catch(e){}
      const blob=await fetchTTS(text);
      try{ if(store) await store.put(req,new Response(blob,{headers:{'Content-Type':blob.type||'audio/mpeg'}})) }catch(e){}
      return URL.createObjectURL(blob);
    })();
    this.pending.set(k,p);
    return p.then(u=>{ this.mem.set(k,u); this.pending.delete(k); return u }, e=>{ this.pending.delete(k); throw e });
  },
  prefetch(text){ if(text && state.settings.provider!=='browser') this.url(text).catch(()=>{}) },
  stop(){
    try{ this.audio.pause() }catch(e){}
    try{ if('speechSynthesis' in window) speechSynthesis.cancel() }catch(e){}
    if(this._done){ const d=this._done; this._done=null; d() }
    setSpeaking(false);
  },
  speak(text,{rate=1}={}){
    this.stop();
    const s=state.settings;
    return new Promise(async res=>{
      let finished=false;
      const done=()=>{ if(finished) return; finished=true; if(this._done===done) this._done=null; setSpeaking(false); res() };
      this._done=done; setSpeaking(true);
      if(s.provider==='browser') return this.browser(text,rate,done);
      try{
        const u=await this.url(text);
        if(this._done!==done) return;
        const a=this.audio; a.src=u; a.playbackRate=s.speed*rate; a.preservesPitch=true; a.webkitPreservesPitch=true;
        a.onended=done; a.onerror=done;
        await a.play();
      }catch(err){
        if(this._done!==done) return;
        this.warn(err); this.browser(text,rate,done);
      }
    });
  },
  hold(ms){
    if(state.settings.provider==='browser') return wait(ms);
    this.stop();
    return new Promise(res=>{
      let finished=false; const done=()=>{ if(finished) return; finished=true; if(this._done===done) this._done=null; res() };
      this._done=done; const a=this.audio, fallback=()=>setTimeout(()=>{ if(this._done===done) done() },ms);
      a.src=silentUrl(ms); a.playbackRate=1; a.onended=done; a.onerror=fallback;
      const pr=a.play(); if(pr) pr.catch(fallback);
    });
  },
  browser(text,rate,done){
    if(!('speechSynthesis' in window)){ done(); return }
    const L=curLang(), u=new SpeechSynthesisUtterance(text);
    u.lang=L.bcp; const v=bestVoice(L.bcp); if(v) u.voice=v;
    u.rate=Math.max(.5,Math.min(1.5,state.settings.speed*rate*.95));
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  },
  warn(err){ const m=String(err&&err.message||''); const friendly = state.settings.provider==='builtin' ? (/no built-in voice/.test(m)?m:'The voice is still loading or offline, so the device voice is used for now') : (m.length<90&&m?m:'Voice error, so the device voice is used'); if(Date.now()-this.lastErr>8000) toast(friendly); this.lastErr=Date.now() }
};
/* Unlock audio on the first real tap (required on iPhone/iPad) */
let unlocked=false;
function unlockAudio(){ if(unlocked) return; unlocked=true; try{ TTS.audio.src=SILENT; const p=TTS.audio.play(); if(p) p.catch(()=>{ unlocked=false }) }catch(e){ unlocked=false } }
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('touchstart',()=>{},{passive:true}); /* enables :active styles on iOS */

const nav = {tab:'home', stack:[]};

const LIST_STEP = 60;
function go(tab){ nav.tab=tab; nav.stack=[]; render(); window.scrollTo(0,0) }
function push(v){ nav.stack.push(v); render(); window.scrollTo(0,0) }
function back(){ nav.stack.pop(); render() }

/* ---------- first load of a language ---------- */
const LOADUI={pct:0, err:null, busy:false};
function loadingView(){
  const L=curLang(), e=LOADUI.err;
  return `<div class="loadbox">${flag(L.code,56)}<h2>${e?'Could not load '+L.name:'Getting '+L.name+' ready…'}</h2>
    <p class="muted">${e?'Check your internet connection and try again.':'This downloads once. After that it works offline.'}</p>
    ${e?`<button class="btn primary" data-act="retryLoad">Try again</button>`:`<div class="dlbar"><i style="width:${LOADUI.pct}%"></i></div>`}</div>`;
}
async function loadCurrent(){
  if(LOADUI.busy) return; LOADUI.busy=true; LOADUI.err=null;
  const code=state.lang;
  try{ await ensureLang(code, p=>{ LOADUI.pct=p; const i=document.querySelector('.dlbar i'); if(i) i.style.width=p+'%' }) }
  catch(e){ LOADUI.err=e }
  LOADUI.busy=false; LOADUI.pct=0;
  const onAuth = curView() && curView().view==='auth';
  if(onAuth){}
  else if(!LOADUI.err || state.lang!==code) render();
  else { const el=$('#screen'); if(el) el.innerHTML=loadingView() }
  loadBase();
}
/* the learner's own language file supplies the translations */
async function loadBase(){
  const b=baseLang(); if(CHUNKS[b] || !LANG_SIZE_MB[b] || b==='en') return;
  try{ await ensureLang(b); if(CHUNKS[state.lang] && !P.on) render() }catch(e){}
}
function render(){
  const v=curView();
  document.body.classList.toggle('nodock', !!(v && v.view==='auth'));
  const waiting = !CHUNKS[state.lang] && !(v && v.view==='auth');
  $('#screen').innerHTML = waiting ? loadingView() : v ? VIEWS[v.view](v) : VIEWS[nav.tab]();
  if(waiting) loadCurrent();
  const el=$('#screen'); el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  $('#dock').innerHTML = TABS.map(t=>`<button class="${nav.tab===t.id?'on':''}" data-act="go" data-tab="${t.id}" aria-label="${t.label}"><span class="di">${ic(t.icon,20)}</span>${t.label}</button>`).join('');
}

function ring(p,size=64,stroke=6,color='#fff',track='rgba(255,255,255,.25)'){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg><span>${p}%</span></div>`;
}
const lvSq = (id,cls='') => `<span class="sq lv ${cls}" style="--c:${LVC[id]}">${id}</span>`;
const catSq = (c,cls='') => `<span class="sq ${cls}" style="--c:${c.color}">${ic(c.icon,24)}</span>`;

function setInfo(key){
  const [t,a,b]=key.split(':');
  if(t==='lvl'){
    const L=LEVELS.find(x=>x.id===a), parts=pathFor(state.lang)[a]||[], n=Number(b)||1;
    return {title:L.parts>1?`${a} · Part ${n}`:`${a} · ${L.name}`, sub:L.parts>1?`${L.name}, part ${n} of ${L.parts}`:L.desc, items:parts[n-1]||[], icon:lvSq(a,'lg'), showCat:true};
  }
  if(t==='cat'){ const c=catOf(a), parts=topicParts(a), n=Number(b)||0;
    if(!n) return {title:c.name, sub:c.desc, items:parts.flat(), icon:catSq(c,'lg'), showLevel:true};
    return {title:`${c.name} · Part ${n}`, sub:`${c.desc} Part ${n} of ${parts.length}.`, items:parts[n-1]||[], icon:catSq(c,'lg'), showLevel:true} }
  return {title:'Favorites', sub:'Chunks you marked with a heart', items:favItems(), icon:`<span class="sq lg" style="--c:#ef4444">${ic('heart',24)}</span>`, showLevel:true};
}

function chunkCard(c,opts={}){
  const st=starsOf(c.id), fav=state.favs.includes(c.id);
  const tag = opts.showLevel ? `<span class="tagl" style="--c:${LVC[c.level]}">${c.level}</span>` : '';
  return `<div class="chunk" data-cid="${c.id}">
    <div class="main"><button class="play" data-act="say" data-id="${c.id}" aria-label="Play">${ic('play',16)}</button>
      <div class="txt"><div class="de">${hl(c.t)}</div><div class="en">${esc(glossOf(c))}</div></div></div>
    <div class="foot">
      <div class="stars" role="group" aria-label="Rate">${[1,2,3].map(n=>`<button class="${n<=st?'on':''}" data-act="rate" data-id="${c.id}" data-n="${n}" aria-label="${n} star${n>1?'s':''}">${ic('star',19)}</button>`).join('')}</div>
      ${tag}
      <button class="heart ${fav?'on':''}" data-act="fav" data-id="${c.id}" aria-label="Favorite">${ic('heart',21)}</button>
    </div></div>`;
}
function chunkList(items,v,opts){
  const limit=v.limit||LIST_STEP, shown=items.slice(0,limit);
  return shown.map(c=>chunkCard(c,opts)).join('') + (items.length>limit?`<button class="btn plain more" data-act="more">Show ${Math.min(LIST_STEP,items.length-limit)} more (${items.length-limit} left)</button>`:'');
}
function emptyBox(icon,title,text,btn=''){ return `<div class="card empty"><div class="ei">${ic(icon,30)}</div><b>${title}</b><p>${text}</p>${btn}</div>` }

function learnList(){
  const q=query.trim().toLowerCase();
  if(q){
    const res=chunks().filter(c=>c.plain.toLowerCase().includes(q)||glossOf(c).toLowerCase().includes(q)).slice(0,60);
    return res.length ? `<div class="label" style="margin-top:4px">${res.length}${res.length===60?'+':''} results</div>${res.map(c=>chunkCard(c,{showLevel:true})).join('')}` : emptyBox('search','No results',`Nothing matches “${esc(query)}”.`);
  }
  if(state.learnMode==='level'){
    const path=pathFor(state.lang);
    return LEVELS.map(Lv=>{
      const parts=path[Lv.id]||[], all=parts.flat();
      return `<div class="card lvcard">
        <div class="lvhead">${lvSq(Lv.id,'lg')}<div class="t"><b>${Lv.id} · ${Lv.name}</b><p>${Lv.desc}</p><p style="font-weight:700;margin-top:4px">${all.length} chunks · ${pct(all)}% learned</p></div></div>
        <div class="parts">${parts.map((pt,i)=>{ const q=pct(pt); return `<button class="part ${q>=80?'done':''}" data-act="open" data-key="lvl:${Lv.id}:${i+1}"><b>Part ${i+1}</b><span>${q}% learned</span><div class="bar"><i style="width:${q}%;background:${Lv.color}"></i></div></button>` }).join('')}</div>
      </div>`;
    }).join('');
  }
  return TOPICS.map(c=>{ const it=chunks().filter(x=>x.cat===c.id), q=pct(it), np=topicParts(c.id).length;
    return `<button class="lrow" data-act="openTopic" data-cat="${c.id}">${catSq(c)}<div class="b"><b>${c.name}</b><span>${np} parts · ${it.length} chunks · ${q}% learned</span><div class="bar"><i style="width:${q}%;background:${c.color}"></i></div></div>${ic('chev',18).replace('<svg','<svg class="chev"')}</button>` }).join('');
}

/* =====================================================================
   PLAYER
   ===================================================================== */
const P = {on:false, loopId:0};
const alive = id => P.on && P.auto && id===P.loopId;
function status(t){ const el=$('#pstatus'); if(el) el.textContent=t||'' }

function startSession(items,{title,key=null,mode='listen',start=0}){
  if(!items.length){ toast('Nothing to practice here yet'); return }
  stopAuto(); TTS.stop();
  Object.assign(P,{on:true,items,idx:Math.min(start,items.length-1),mode,title,key,revealed:mode==='listen',showEn:false,auto:false,done:false,count:0});
  if(key) touchRecent();
  renderPlayer();
  $('#player').classList.add('open'); $('#player').setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');
  if(mode==='listen') setTimeout(playCurrent,350);
}
function touchRecent(){
  if(!P.key) return;
  state.recent=state.recent.filter(r=>!(r.key===P.key&&r.lang===state.lang));
  state.recent.unshift({key:P.key,lang:state.lang,idx:P.done?P.items.length:P.idx,total:P.items.length,ts:Date.now()});
  state.recent=state.recent.slice(0,10); save();
}
function closePlayer(){
  if(typeof SYNC!=='undefined' && SYNC.dirty) setTimeout(()=>scheduleSync(1500),0);
  stopAuto(); TTS.stop(); P.on=false;
  $('#player').classList.remove('open'); $('#player').setAttribute('aria-hidden','true');
  document.body.classList.remove('noscroll'); render();
}
function starRow(id,size=24){ const st=starsOf(id); return [1,2,3].map(n=>`<button class="${n<=st?'on':''}" data-act="rate" data-id="${id}" data-n="${n}" aria-label="${n} star${n>1?'s':''}">${ic('star',size)}</button>`).join('') }

function renderPlayer(){
  const forever = state.settings.loopMode==='forever';
  const el=$('#player');
  if(P.done){
    const t=todayCount(), g=state.settings.dailyGoal, p=Math.min(100,Math.round(t/g*100));
    el.innerHTML=`<div class="pw"><div class="ptop"><button class="iconbtn" data-act="pclose" aria-label="Close">${ic('x')}</button><div class="t"><b>${esc(P.title)}</b><div class="bar"><i style="width:100%"></i></div></div></div>
      <div class="pend"><div class="ei">${ic('party',40)}</div><h2>Session complete</h2><p class="muted">You practiced ${P.count} sentence${P.count===1?'':'s'}.</p>
      <div class="card" style="display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;text-align:left">${ring(p,56,6,'var(--blue-2)','var(--card-2)')}<div><b>Today's goal</b><p class="muted">${t} / ${g} sentences</p></div></div>
      <div class="row-btns"><button class="btn plain" data-act="again">${ic('loop',18)} Again</button><button class="btn primary" data-act="pclose">Done</button></div></div></div>`;
    return;
  }
  const c=P.items[P.idx], cat=catOf(c.cat), listen=P.mode==='listen', showDe=listen||P.revealed, fav=state.favs.includes(c.id);
  const showEn = listen ? (state.settings.showEn||P.showEn) : true;
  el.innerHTML=`<div class="pw">
    <div class="ptop"><button class="iconbtn" data-act="pclose" aria-label="Close">${ic('x')}</button>
      <div class="t"><b>${esc(P.title)}</b><div class="bar"><i style="width:${P.idx/P.items.length*100}%"></i></div></div><span class="n">${P.idx+1}/${P.items.length}</span></div>
    <div class="seg" style="margin:0 0 14px"><button class="${listen?'on':''}" data-act="pmode" data-m="listen">${ic('headphones',17)} Listen</button><button class="${!listen?'on':''}" data-act="pmode" data-m="recall">${ic('eye',17)} Recall</button></div>
    <div class="pcard">
      <div class="ptags"><span class="tagl" style="--c:${LVC[c.level]}">${c.level}</span><span class="tag">${ic(cat.icon,13)} ${cat.name}</span>
        <button class="heart ${fav?'on':''}" data-act="fav" data-id="${c.id}" aria-label="Favorite">${ic('heart',22)}</button></div>
      ${!listen?`<div class="pen big">${esc(glossOf(c))}</div>`:''}
      ${showDe?`<div class="pde">${hl(c.t)}</div>`:`<div class="phide">Say it in ${curLang().name}…</div>`}
      ${listen?(showEn?`<div class="pen">${esc(glossOf(c))}</div>`:`<button class="link" data-act="showen">Show translation</button>`):''}
      ${!showDe?`<button class="btn primary" style="flex:none;padding:0 24px" data-act="reveal">${ic('eye',19)} Reveal &amp; listen</button>`:''}
      <div class="stars prate" role="group" aria-label="Rate">${starRow(c.id)}</div>
      <div class="pstatus" id="pstatus" aria-live="polite"></div>
    </div>
    <div class="pctl">
      <button class="ctl" data-act="pprev" aria-label="Previous">${ic('prev',20)}</button>
      <button class="ctl" data-act="pslow" aria-label="Play slowly">${ic('snail',22)}</button>
      <button class="ctl big" data-act="pplay" aria-label="Play">${ic('play',32)}</button>
      <span class="hfwrap"><button class="ctl" data-act="pauto" aria-label="Hands-free" style="${P.auto?'color:var(--blue-2);border-color:var(--blue-2)':''}">${ic(P.auto?'pause':'loop',20)}</button><button class="hfmode ${forever?'inf':''}" data-act="ploopmode" aria-label="${forever?'Hands-free repeats forever. Tap to play through once':'Hands-free plays through once. Tap to repeat forever'}">${forever?ic('inf',14,2.6):'1'}</button></span>
      <button class="ctl" data-act="pnext" aria-label="Next">${ic('next',20)}</button>
    </div>
    <div class="pauto"><span class="muted small">${P.auto?'Hands-free is on: listen, repeat, next':'Tap the loop button for hands-free mode'} · ${forever?'repeats forever':'plays through once'}</span></div>
    <div class="grade">
      <button class="g1" data-act="grade" data-g="again">Again<small>show sooner</small></button>
      <button class="g2" data-act="grade" data-g="good">Got it<small>normal</small></button>
      <button class="g3" data-act="grade" data-g="easy">Easy<small>show later</small></button>
    </div>
  </div>`;
  TTS.prefetch(c.plain); TTS.prefetch(P.items[P.idx+1]?.plain);
}

async function playCurrent(rate=1){
  if(!P.on||P.done) return;
  const c=P.items[P.idx];
  if(P.mode==='recall'&&!P.revealed){ P.revealed=true; renderPlayer() }
  status(rate<1?'Playing slowly…':'Listen…');
  await TTS.speak(c.plain,{rate});
  if(P.on&&P.items[P.idx]===c&&!P.auto) status('Now say it out loud');
}
function goTo(i){ if(i<0) return; if(i>=P.items.length){ finish(); return } P.idx=i; P.revealed=P.mode==='listen'; P.showEn=false; touchRecent(); renderPlayer() }
function next(autoPlay=true){ goTo(P.idx+1); if(autoPlay&&P.on&&!P.done&&P.mode==='listen'&&!P.auto) setTimeout(playCurrent,250) }
function finish(){ stopAuto(); TTS.stop(); P.done=true; touchRecent(); renderPlayer() }
function stopAuto(){ if(P.auto){ P.auto=false; P.loopId++; TTS.stop(); if(P.on) renderPlayer() } }
/* lock-screen / headphone controls */
function mediaInfo(c){
  if(!('mediaSession' in navigator) || !c) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({title:c.plain, artist:'Fluently · '+curLang().name, album:P.title||'Fluently', artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'},{src:'icon-192.png',sizes:'192x192',type:'image/png'}]});
    const h={play:()=>{ if(P.on&&!P.done&&!P.auto){ TTS.stop(); autoLoop() } }, pause:()=>stopAuto(), stop:()=>stopAuto(),
      nexttrack:()=>{ if(P.on&&!P.done){ const a=P.auto; stopAuto(); goTo(P.idx+1); if(a&&!P.done) autoLoop() } },
      previoustrack:()=>{ if(P.on&&P.idx>0){ const a=P.auto; stopAuto(); goTo(P.idx-1); if(a) autoLoop() } }};
    Object.entries(h).forEach(([k,f])=>{ try{ navigator.mediaSession.setActionHandler(k,f) }catch(e){} });
    navigator.mediaSession.playbackState = P.auto?'playing':'paused';
  }catch(e){}
}
async function autoLoop(){
  const id=++P.loopId; P.auto=true; renderPlayer();
  const s=state.settings;
  while(alive(id)&&!P.done){
    const c=P.items[P.idx];
    mediaInfo(c);
    if(P.mode==='recall'){ P.revealed=false; renderPlayer(); status('Say it in '+curLang().name+'…'); await TTS.hold(s.gap*1000+1500); if(!alive(id)) return; P.revealed=true; renderPlayer() }

/* =====================================================================
   ACCOUNTS + CLOUD SYNC (Supabase)
   Works offline-first: everything saves on the device right away and
   syncs to your account whenever there is internet.
   ===================================================================== */
const cloudOn = () => !!(CLOUD.url && CLOUD.anonKey);
const AUTH_KEY = 'fluently:auth';
async function sb(path,{method='GET',body,token,headers={}}={}){
  const h = Object.assign({'apikey':CLOUD.anonKey,'Content-Type':'application/json'}, headers);
  if(token) h.Authorization = 'Bearer '+token;
  const r = await fetch(CLOUD.url.replace(/\/+$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  const txt = await r.text(); let j=null; try{ j = txt ? JSON.parse(txt) : null }catch(e){}
  if(!r.ok){ const m = j && (j.msg||j.error_description||j.message||j.error) || ('Error '+r.status); const err=new Error(friendlyAuth(String(m))); err.status=r.status; throw err }
  return j;
}
function friendlyAuth(m){
  if(/invalid login|invalid_credentials|invalid_grant/i.test(m)) return 'Wrong email or password.';
  if(/not confirmed/i.test(m)) return 'Please confirm your email first. Check your inbox for the link.';
  if(/already registered|already exists/i.test(m)) return 'That email already has an account. Try logging in.';
  if(/password.*(6|characters|short|weak)/i.test(m)) return 'Password must be at least 6 characters.';
  if(/email rate limit|over_email_send_rate_limit/i.test(m)) return 'Sign-up emails are busy right now. If you already have an account, log in instead.';
  if(/rate limit|too many/i.test(m)) return 'Too many tries. Please wait a minute and try again.';
  if(/failed to fetch|network/i.test(m)) return 'No connection. Please try again when you are online.';
  return m;
}
const AUTH = {
  s:(()=>{ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null') }catch(e){ return null } })(),
  _ref:null,
  get user(){ return this.s && this.s.user },
  set(j, user){
    const exp = j.expires_at || (Math.floor(Date.now()/1000) + (Number(j.expires_in)||3600));
    this.s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Number(exp), user:user||(j.user?{id:j.user.id,email:j.user.email}:this.user)};
    try{ localStorage.setItem(AUTH_KEY, JSON.stringify(this.s)) }catch(e){}
  },
  clear(){ this.s=null; try{ localStorage.removeItem(AUTH_KEY) }catch(e){} },
  async token(){
    if(!this.s) throw new Error('Not logged in');
    if(this.s.expires_at*1000 - Date.now() < 90e3) await this.refresh();
    return this.s.access_token;
  },
  refresh(){
    if(this._ref) return this._ref;
    this._ref = (async()=>{
      try{ const j = await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:this.s.refresh_token}}); this.set(j) }
      catch(e){ if(e.status>=400 && e.status<500){ this.clear(); setSync('signedout'); render() } throw e }
      finally{ this._ref=null }
    })();
    return this._ref;
  }
};

/* ---------- merge two copies of progress (this device + account) ---------- */
function stableStr(o){ if(o===null||typeof o!=='object') return JSON.stringify(o); if(Array.isArray(o)) return '['+o.map(stableStr).join(',')+']'; return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stableStr(o[k])).join(',')+'}' }
function payload(){
  const st = Object.assign({}, state.settings); delete st.keys;   /* API keys never leave this device */
  return {v:1, cards:state.cards, stars:state.stars, favs:state.favs, ts:state.ts, actBy:state.actBy, recent:state.recent, settings:st, resetAt:state.resetAt||0};
}
function mergeData(a,b){
  a=a||{}; b=b||{};
  const resetAt = Math.max(a.resetAt||0, b.resetAt||0), out = {v:1, resetAt};
  const cards = {};
  [a.cards||{}, b.cards||{}].forEach(src=>Object.entries(src).forEach(([id,c])=>{ if((c.last||0)<resetAt) return; if(!cards[id] || (c.last||0)>(cards[id].last||0)) cards[id]=c }));
  out.cards = cards;
  const ts={}, stars={}, favT=[]; let settings=a.settings||b.settings, setT=0;
  const ka=a.ts||{}, kb=b.ts||{};
  new Set([...Object.keys(ka),...Object.keys(kb)]).forEach(k=>{
    const ta=ka[k]||0, tb=kb[k]||0, src = ta>=tb ? a : b, t = Math.max(ta,tb);
    if(t<resetAt) return;
    ts[k]=t;
    if(k.startsWith('s:')){ const id=k.slice(2), v=(src.stars||{})[id]; if(v) stars[id]=v }
    else if(k.startsWith('f:')){ const id=k.slice(2); if((src.favs||[]).includes(id)) favT.push([id,t]) }
    else if(k==='settings'){ settings = src.settings || settings; setT=t }
  });
  out.ts=ts; out.stars=stars; out.favs=favT.sort((x,y)=>y[1]-x[1]).map(x=>x[0]); out.settings=settings;
  const actBy={};
  [a.actBy||{}, b.actBy||{}].forEach(src=>Object.entries(src).forEach(([dev,days])=>{ actBy[dev]=actBy[dev]||{}; Object.entries(days).forEach(([d,n])=>{ actBy[dev][d]=Math.max(actBy[dev][d]||0,n) }) }));
  if(resetAt){ const cut=dayKey(new Date(resetAt)); Object.values(actBy).forEach(days=>Object.keys(days).forEach(d=>{ if(d<cut) delete days[d] })) }
  out.actBy=actBy;
  const rec={};
  [...(a.recent||[]),...(b.recent||[])].forEach(r=>{ if(r.ts<resetAt) return; const k=r.key+'|'+r.lang; if(!rec[k]||r.ts>rec[k].ts) rec[k]=r });
  out.recent=Object.values(rec).sort((x,y)=>y.ts-x.ts).slice(0,10);
  return out;
}
function applyData(d){
  state.cards=d.cards||{}; state.stars=d.stars||{}; state.favs=d.favs||[]; state.ts=d.ts||{}; state.actBy=d.actBy||{}; state.recent=d.recent||[]; state.resetAt=d.resetAt||0;
  if(d.settings){ state.settings = Object.assign({}, DEFAULTS, state.settings, d.settings); state.settings.piperVoice = Object.assign({}, state.settings.piperVoice||{}) }
  if(!state.actBy[state.deviceId]) state.actBy[state.deviceId]={};
}

/* ---------- sync engine ---------- */
var SYNC = {status:'idle', msg:'', busy:false, dirty:!!state.pendingSync, timer:null, due:0};
function setSync(s,msg=''){ SYNC.status=s; SYNC.msg=msg; document.querySelectorAll('.syncstatus').forEach(el=>el.textContent=syncText()) }
function syncText(){
  if(!cloudOn()) return '';
  if(!AUTH.user) return 'Not logged in';
  if(!navigator.onLine || SYNC.status==='offline') return 'Offline. Changes are saved and will sync when you are back online.';
  if(SYNC.status==='syncing') return 'Syncing…';
  if(SYNC.status==='error') return 'Sync problem: '+SYNC.msg+' (will retry)';
  const t = state.lastSync; if(!t) return 'Not synced yet';
  const m = Math.round((Date.now()-t)/60000);
  return 'Synced ' + (m<1?'just now':m===1?'1 minute ago':m<60?m+' minutes ago':new Date(t).toLocaleString());
}
/* Throttled, not debounced: the first change books a sync, later changes ride along.
   During practice it waits 30 seconds so a session uploads in a few small batches. */
function scheduleSync(delay){
  if(!cloudOn()||!AUTH.user) return;
  if(delay==null) delay = (typeof P!=='undefined' && P.on) ? 30000 : 4000;
  const due = Date.now()+delay;
  if(SYNC.timer && SYNC.due<=due) return;
  clearTimeout(SYNC.timer); SYNC.due=due;
  SYNC.timer=setTimeout(()=>{ SYNC.timer=null; syncNow() }, delay);
}
const enc = encodeURIComponent;
/* Write only if nobody else wrote since we last looked (compare-and-swap on updated_at).
   Returns the new updated_at, or null if another device got there first. */
async function writeProgress(tok, uid, data, knownTs){
  const body = {data, updated_at:new Date().toISOString()};
  if(knownTs){
    const res = await sb(`/rest/v1/progress?user_id=eq.${enc(uid)}&updated_at=eq.${enc(knownTs)}&select=updated_at`,{method:'PATCH',token:tok,headers:{'Prefer':'return=representation'},body});
    return res && res[0] ? res[0].updated_at : null;
  }
  const res = await sb(`/rest/v1/progress?on_conflict=user_id&select=updated_at`,{method:'POST',token:tok,headers:{'Prefer':'resolution=ignore-duplicates,return=representation'},body:Object.assign({user_id:uid},body)});
  return res && res[0] ? res[0].updated_at : null;
}
async function syncNow(){
  if(!cloudOn() || !AUTH.user) return;
  if(!navigator.onLine){ setSync('offline'); return }
  if(SYNC.busy){ SYNC.again=true; return }
  clearTimeout(SYNC.timer); SYNC.timer=null;
  SYNC.busy=true; SYNC.again=false; setSync('syncing');
  const wasDirty = SYNC.dirty; SYNC.dirty=false;
  try{
    const tok = await AUTH.token(), uid = AUTH.user.id;
    /* 1. Tiny check: has anything changed on the server since our last sync? */
    const meta = await sb(`/rest/v1/progress?select=updated_at&user_id=eq.${enc(uid)}`,{token:tok});
    const serverTs = meta && meta[0] ? meta[0].updated_at : null;
    let done = false;
    if(serverTs && serverTs===state.remoteTs){
      if(!wasDirty) done = true;                        /* nothing changed anywhere: no data moved */
      else { const t = await writeProgress(tok, uid, payload(), serverTs); if(t){ state.remoteTs=t; done=true } }
    }
    /* 2. Something changed elsewhere (or first sync): download once, merge, write back. */
    for(let attempt=0; !done && attempt<3; attempt++){
      const rows = await sb(`/rest/v1/progress?select=data,updated_at&user_id=eq.${enc(uid)}`,{token:tok});
      const remote = rows && rows[0] ? rows[0].data : null, rts = rows && rows[0] ? rows[0].updated_at : null;
      const before = stableStr(payload());
      const merged = remote ? mergeData(payload(), remote) : payload();
      applyData(merged); saveLocal();
      if(before!==stableStr(payload())) refreshAfterSync();
      if(remote && stableStr(merged)===stableStr(remote)){ state.remoteTs=rts; done=true; break }
      const t = await writeProgress(tok, uid, merged, rts);
      if(t){ state.remoteTs=t; done=true }
    }
    if(!done) throw new Error('Could not save, will retry');
    state.lastSync=Date.now(); if(!SYNC.dirty) state.pendingSync=false; saveLocal(); setSync('ok');
  }catch(e){
    if(wasDirty) SYNC.dirty=true;
    if(!navigator.onLine || /connection|fetch/i.test(e.message)) setSync('offline'); else setSync(AUTH.user?'error':'signedout', e.message);
    clearTimeout(SYNC.timer); SYNC.timer=null; scheduleSync(30000);
  }finally{
    SYNC.busy=false;
    if(SYNC.again || SYNC.dirty) scheduleSync();
  }
}
function refreshAfterSync(){
  const v=curView(), typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if(P.on || typing || (v && v.view==='auth')) return;
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
window.addEventListener('online', ()=>{ setSync('idle'); syncNow() });
window.addEventListener('offline', ()=>setSync('offline'));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') scheduleSync(500); else if(SYNC.dirty) syncNow() });

/* ---------- auth actions ---------- */
async function afterLogin(msg){
  state.welcomed = true; saveLocal();
  nav.stack = nav.stack.filter(v=>v.view!=='auth'); nav.tab='home';
  render(); toast(msg||'Logged in. Syncing your progress…');
  await syncNow();
}
async function authSubmit(form){
  const mode=form.dataset.mode, email=(form.email?.value||'').trim(), pass=form.password?.value||'';
  const btn=form.querySelector('button[type=submit]'), err=form.querySelector('.aerr');
  const fail = m => { err.textContent=m; err.hidden=false; btn.disabled=false; btn.textContent=btn.dataset.label };
  err.hidden=true; btn.disabled=true; btn.dataset.label=btn.dataset.label||btn.textContent; btn.textContent='Please wait…';
  if(!navigator.onLine) return fail('You are offline. Connect to the internet to log in.');
  try{
    if(mode==='login'){
      const j = await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:pass}});
      AUTH.set(j); await afterLogin();
    } else if(mode==='signup'){
      if(pass.length<6) return fail('Password must be at least 6 characters.');
      const j = await sb('/auth/v1/signup?redirect_to='+encodeURIComponent(siteUrl()),{method:'POST',body:{email,password:pass}});
      if(j && j.access_token){ AUTH.set(j); await afterLogin('Account created!') }
      else { curView().mode='check'; curView().email=email; render() }
    } else if(mode==='forgot'){
      await sb('/auth/v1/recover?redirect_to='+encodeURIComponent(siteUrl()),{method:'POST',body:{email}});
      curView().mode='sent'; curView().email=email; render();
    } else if(mode==='newpass'){
      if(pass.length<6) return fail('Password must be at least 6 characters.');
      await sb('/auth/v1/user',{method:'PUT',token:await AUTH.token(),body:{password:pass}});
      await afterLogin('Password updated. You are logged in.');
    }
  }catch(e){ fail(e.message) }
}
async function resendConfirm(email){
  try{ await sb('/auth/v1/resend?redirect_to='+encodeURIComponent(siteUrl()),{method:'POST',body:{type:'signup',email}}); toast('Email sent again') }catch(e){ toast(e.message) }
}
async function logout(){
  if(SYNC.dirty || !state.lastSync){ if(navigator.onLine) await syncNow() }
  if(SYNC.dirty && !confirm('Some changes have not synced yet because you are offline. Log out anyway and lose them on this device?')) return;
  try{ await sb('/auth/v1/logout',{method:'POST',token:AUTH.s.access_token}) }catch(e){}
  AUTH.clear();
  const keep = {settings:state.settings, lang:state.lang, deviceId:state.deviceId, voiceReady:state.voiceReady, welcomed:true, learnMode:state.learnMode};
  state = Object.assign({cards:{}, stars:{}, favs:[], ts:{}, actBy:{[state.deviceId]:{}}, recent:[], resetAt:0, lastSync:0, remoteTs:null, pendingSync:false}, keep);
  saveLocal(); setSync('signedout'); go('home'); toast('Logged out. Your progress is safe in your account.');
}
/* links from emails come back with the session in the URL hash */
async function handleAuthHash(){
  const h = location.hash.startsWith('#') ? new URLSearchParams(location.hash.slice(1)) : null;
  if(!h || !(h.get('access_token') || h.get('error'))) return;
  history.replaceState(null,'',location.pathname+location.search);
  if(h.get('error')){ toast((h.get('error_description')||'That link did not work').replace(/\+/g,' ')+'. Please try again.'); push({view:'auth',mode:'login'}); return }
  if(!cloudOn()) return;
  const j = {access_token:h.get('access_token'), refresh_token:h.get('refresh_token'), expires_in:h.get('expires_in'), expires_at:h.get('expires_at')};
  try{
    const u = await sb('/auth/v1/user',{token:j.access_token});
    AUTH.set(j,{id:u.id,email:u.email});
    if(h.get('type')==='recovery'){ push({view:'auth',mode:'newpass'}); return }
    await afterLogin(h.get('type')==='signup'?'Email confirmed. Welcome to Fluently!':'Logged in.');
  }catch(e){ toast(e.message) }
}
function accountCard(){
  if(!cloudOn()) return `<div class="card"><div class="field"><span class="fl">Accounts are not set up yet</span><p class="desc">Your progress is saved on this device. To turn on accounts and syncing, add your Supabase URL and key at the top of the app code.</p></div></div>`;
  if(!AUTH.user) return `<div class="card"><div class="acct"><span class="sq" style="--c:var(--blue)">${ic('cloud',24)}</span><div class="b"><b>Save your progress everywhere</b><p>Log in to sync your stars, favorites and streak across all of your devices.</p></div></div>
    <div class="row-btns" style="margin-top:14px"><button class="btn primary sm" style="flex:1" data-act="auth" data-mode="login">Log in</button><button class="btn soft sm" style="flex:1" data-act="auth" data-mode="signup">Create account</button></div></div>`;
  return `<div class="card"><div class="acct"><span class="sq" style="--c:var(--blue)">${esc((AUTH.user.email||'?')[0].toUpperCase())}</span><div class="b"><b>${esc(AUTH.user.email||'')}</b><p class="syncstatus">${syncText()}</p></div></div>
    <div class="row-btns" style="margin-top:14px"><button class="btn soft sm" style="flex:1" data-act="syncNow">${ic('cloud',18)} Sync now</button><button class="btn plain sm" style="flex:1" data-act="logout">Log out</button></div></div>`;
}
function authView(v){
  const m=v.mode||'welcome', field=(type,name,label,ac,extra='')=>`<label class="afield"><span>${label}</span><input class="inp" type="${type}" name="${name}" autocomplete="${ac}" ${extra} required></label>`;
  const logo=`<div class="alogo">${LOGO_SVG}</div>`;
  const back = (m==='welcome' && !v.from) ? '' : `<button class="iconbtn" data-act="authBack" aria-label="Back">${ic('back')}</button>`;
  let body='';
  if(m==='welcome') body=`${logo}<h1>Fluently</h1><p class="asub">Learn ${curLang().name} the natural way, in real chunks you hear and repeat.</p>
    <div class="astack"><button class="btn primary" data-act="authMode" data-mode="signup">Create a free account</button><button class="btn plain" data-act="authMode" data-mode="login">I already have an account</button>
    <button class="link" data-act="guest" style="margin-top:6px">Continue without an account</button></div><p class="anote">With an account, your progress syncs across your phone, tablet and computer.</p>`;
  else if(m==='login') body=`<h1>Log in</h1><p class="asub">Welcome back!</p><form class="aform" data-mode="login" novalidate>${field('email','email','Email','email','inputmode="email" autocapitalize="off"')}${field('password','password','Password','current-password')}<p class="aerr" hidden></p><button class="btn primary" type="submit">Log in</button></form>
    <div class="alinks"><button class="link" data-act="authMode" data-mode="forgot">Forgot password?</button><button class="link" data-act="authMode" data-mode="signup">Create an account</button></div>`;
  else if(m==='signup') body=`<h1>Create account</h1><p class="asub">Your progress on this device will be added to your new account.</p><form class="aform" data-mode="signup" novalidate>${field('email','email','Email','email','inputmode="email" autocapitalize="off"')}${field('password','password','Password (6+ characters)','new-password','minlength="6"')}<p class="aerr" hidden></p><button class="btn primary" type="submit">Create account</button></form>
    <div class="alinks"><button class="link" data-act="authMode" data-mode="login">I already have an account</button></div>`;
  else if(m==='check') body=`${logo}<h1>Check your email</h1><p class="asub">We sent a confirmation link to <b>${esc(v.email||'')}</b>. Open it on this device to finish creating your account.</p><div class="astack"><button class="btn plain" data-act="resend" data-email="${esc(v.email||'')}">Send the email again</button><button class="btn primary" data-act="authMode" data-mode="login">Back to log in</button></div>`;
  else if(m==='forgot') body=`<h1>Reset password</h1><p class="asub">Enter your email and we will send you a link to choose a new password.</p><form class="aform" data-mode="forgot" novalidate>${field('email','email','Email','email','inputmode="email" autocapitalize="off"')}<p class="aerr" hidden></p><button class="btn primary" type="submit">Send reset link</button></form>`;
  else if(m==='sent') body=`${logo}<h1>Check your email</h1><p class="asub">If <b>${esc(v.email||'')}</b> has an account, a reset link is on its way.</p><div class="astack"><button class="btn primary" data-act="authMode" data-mode="login">Back to log in</button></div>`;
  else if(m==='newpass') body=`<h1>New password</h1><p class="asub">Choose a new password for your account.</p><form class="aform" data-mode="newpass" novalidate>${field('password','password','New password (6+ characters)','new-password','minlength="6"')}<p class="aerr" hidden></p><button class="btn primary" type="submit">Save password</button></form>`;
  return `<div class="auth">${back?`<div class="atop">${back}</div>`:''}<div class="abody">${body}</div></div>`;
}
document.addEventListener('submit', e=>{ const f=e.target.closest('form.aform'); if(!f) return; e.preventDefault(); authSubmit(f) });

/* ---------- backup & transfer (works with or without an account) ---------- */
function toB64(bytes){ let s=''; const n=0x8000; for(let i=0;i<bytes.length;i+=n) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+n)); return btoa(s) }
function fromB64(str){ const bin=atob(str); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u }
function backupObject(){ return {app:'fluently', v:1, created:new Date().toISOString(), lang:state.lang, data:payload()} }
async function backupCode(){
  const bytes = new TextEncoder().encode(JSON.stringify(backupObject()));
  if(typeof CompressionStream!=='undefined'){
    try{ const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return 'FLU1Z-'+toB64(new Uint8Array(buf)) }catch(e){}
  }
  return 'FLU1J-'+toB64(bytes);
}
async function parseBackup(text){
  text=String(text||'').trim();
  if(!text) throw new Error('Paste a backup code first.');
  let obj;
  if(text[0]==='{') obj=JSON.parse(text);
  else {
    const m=text.replace(/\s+/g,'').match(/^FLU1([ZJ])-(.+)$/);
    if(!m) throw new Error('That does not look like a Fluently backup code.');
    let bytes; try{ bytes=fromB64(m[2]) }catch(e){ throw new Error('The code is incomplete. Copy the whole code and try again.') }
    if(m[1]==='Z'){
      if(typeof DecompressionStream==='undefined') throw new Error('This browser is too old to open backup codes. Use a backup file instead.');
      try{ bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()) }catch(e){ throw new Error('The code is incomplete. Copy the whole code and try again.') }
    }
    obj=JSON.parse(new TextDecoder().decode(bytes));
  }
  if(!obj || obj.app!=='fluently' || !obj.data) throw new Error('That is not a Fluently backup.');
  return obj;
}
function restoreBackup(obj){
  const merged = mergeData(payload(), obj.data);
  applyData(merged); save(); render();
  const d=obj.data; toast(`Backup restored: ${Object.keys(d.cards||{}).length} practiced, ${Object.keys(d.stars||{}).length} starred, ${(d.favs||[]).length} favorites`);
}
async function doBackupFile(){
  const blob=new Blob([JSON.stringify(backupObject())],{type:'application/json'}), name='fluently-backup-'+dayKey()+'.json';
  try{ const file=new File([blob],name,{type:'application/json'}); if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){ await navigator.share({files:[file], title:'Fluently backup'}); return } }catch(e){ if(e && e.name==='AbortError') return }
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Backup file saved');
}
async function doBackupCode(){
  const code=await backupCode(), out=$('#bkout'); if(out){ out.hidden=false; out.value=code; out.focus(); out.select() }
  try{ await navigator.clipboard.writeText(code); toast('Backup code copied. Paste it on your other device.') }catch(e){ toast('Select the code and copy it') }
}
document.addEventListener('change', async e=>{
  if(e.target.id!=='bkfile' || !e.target.files[0]) return;
  try{ restoreBackup(await parseBackup(await e.target.files[0].text())) }catch(err){ toast(err.message||'Could not read that file') }
  e.target.value='';
});

/* ---------- offline: service worker + persistent storage ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist() }catch(e){}

/* ---------- boot ---------- */
applyTheme();
if(cloudOn() && !AUTH.user && !state.welcomed && !location.hash.includes('access_token')) nav.stack=[{view:'auth',mode:'welcome',hist:[]}];
render();
if(!CHUNKS[state.lang]) loadCurrent();
handleAuthHash();
window.addEventListener('hashchange', handleAuthHash);
if(AUTH.user) syncNow();
setInterval(()=>{ if(AUTH.user && document.visibilityState==='visible') syncNow() }, 5*60e3);
setInterval(()=>document.querySelectorAll('.syncstatus').forEach(el=>el.textContent=syncText()), 30e3);
setTimeout(()=>PIPER.warm(),800);
</script>
